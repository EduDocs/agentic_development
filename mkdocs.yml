site_name: Agentic Development in Research
site_description: >-
  A project-based graduate course on building agentic AI systems for research,
  culminating in agentic evolutionary frameworks that automate discovery.
site_author: Agentic Development in Research
copyright: Dedicated to the public domain under CC0 1.0 Universal.

# Single source of truth: site-src/ holds the homepage plus directory symlinks to
# the real course folders, so the site renders the same markdown the PDF build uses
# without duplicating any content. The symlinks are not committed — they regenerate
# via `just site-links` (which the serve/site recipes run automatically).
docs_dir: site-src
site_dir: site

theme:
  name: material
  language: en
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/git-alt
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.tilde

extra_css:
  - stylesheets/tamu.css

plugins:
  - search

# Workshop source files are built and reachable from their INDEX, but kept out of
# the main nav; CLAUDE.md is maintainer-facing. Silence the not-in-nav notices.
not_in_nav: |
  /CLAUDE.md
  /resources/

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore
  nav:
    not_found: warn

nav:
  - Home: index.md
  - Course:
      - Overview: syllabus/README.md
      - Learning Outcomes: syllabus/outcomes.md
      - Calendar (14 weeks): syllabus/calendar.md
      - Assessment & Weights: syllabus/assessment.md
      - Outcome → Evidence Map: syllabus/assessment-map.md
      - Skill Progression: PROGRESSION.md
      - Shared Substrate (Benchmarks): benchmarks/README.md
  - Tasks:
      - Onboarding Overview: tasks/README.md
