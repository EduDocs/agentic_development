# nel.toml — the per-project manifest. The engine reads it; you edit it.
#
# Centralizes the knobs the Python entrypoints (evaluate.py) consume, so config
# stops being scattered across CLAUDE.md prose and Python constants. Things that
# already have an authoritative home and their own consumer are NOT duplicated
# here (pointers at the bottom).

[project]
# Globally-unique, location-independent id as "owner/slug" (namespaced like a
# GitHub repo). `owner` is an ownership identity (a Google account/domain or org;
# scaffold.py seeds "local/<dir>"); `slug` is this project's short name. It scopes
# the project's attempts in a shared archive — independent of where the DB lives.
id = "local/agentic-development-notes"
title = "Agentic Development in Research — Course Notes"
# The budget for ONE unattended run: a bound so the run terminates, not a target.
# (There is deliberately no `target_score` — the reviewer score is a mean of
# uncalibrated 0–1 judgements that moves between runs on an unchanged draft, so
# thresholding it stopped runs for reasons unrelated to the notes. ADR 0010.)
max_attempts = 10       # per-branch attempt budget

[evaluation]
review_timeout = 240    # seconds per reviewer backend call
compile_timeout = 180   # seconds per pdflatex pass

# The quantitative EVALUATOR stage (metrics.py; ADR 0005): deterministic
# checks over the manuscript + compile log, always reported in feedback. A
# metric listed in `gate` REJECTS the draft in milliseconds, before the
# reviewer panel spends any LLM call. Gateable: undefined-references,
# undefined-citations, multiply-defined-labels, todo-markers. Editing this
# list changes the evaluator_version (no stale cache reuse).
[evaluation.metrics]
gate = ["undefined-references", "undefined-citations",
        "multiply-defined-labels", "todo-markers"]

# The reviewer panel: one entry per expert lens. `persona` names
# prompts/reviewers/<persona>.md. `backend_pref` is tried in order against the
# CLIs actually installed; falls back to `claude` with `model` otherwise.
# Editing this table or any persona file changes the evaluator_version, so a new
# panel never silently reuses an old evaluation-cache entry.
# The `notes` profile (engine personas/profiles.toml, ADR 0022).
#
# `rigor` and `visual` are DESELECTED, not deleted — their rubrics are still in
# .nel/prompts/reviewers/ and reachable on demand as `/critique by rigor` or
# `by visual`. That is the lens case (ADR 0021): a targeted attended read that
# costs one call and touches neither the panel nor the archive. Re-declare
# either here if a run should judge by it every time.
[[evaluation.panel]]
persona = "currency"
backend_pref = ["claude"]
model = "sonnet"

[[evaluation.panel]]
persona = "clarity"
backend_pref = ["claude"]
model = "sonnet"

[[evaluation.panel]]
persona = "pedagogy"
backend_pref = ["claude"]
model = "opus"

[[evaluation.panel]]
# Whole-document and cross-round: the lens that tracks whether promising spine
# directions actually get realized as prose. `pedagogy` is holistic too, but per
# chapter and for student readiness — watch whether the pair earns its keep.
persona = "editor"
backend_pref = ["claude"]
model = "opus"

# Authoritative elsewhere (own consumer; not duplicated here):
#   strategies -> prompts/strategies.txt  (per-branch biases, read by run.sh)
#   spine      -> main.tex \input list     (section order, read by LaTeX)
