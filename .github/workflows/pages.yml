name: Deploy course site

# Builds the site and deploys it to GitHub Pages.
#
# Two pieces are assembled into one deployment:
#   /          the notes landing page + concept map + book PDF (notes/site/)
#   /course/   the MkDocs course site (site-src/ -> site/)
#
# The site is built in CI and published via the *GitHub Actions* Pages source
# (not the gh-pages branch). The build step runs `mkdocs build --strict`, so a
# broken link or a missing nav file fails the run rather than shipping a broken
# site: that is the "test" in build/test/deploy.
#
# The book PDF is built locally (`just notes-pdf`) and COMMITTED under
# notes/site/, so a push carries the current build. Nothing here runs LaTeX.
#
# One-time setup in the repo's GitHub settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# Manual only: this site deploys when you ask it to, never automatically on a
# push. Trigger it with:  just deploy   (or `gh workflow run pages.yml`).
# It deploys the *pushed* state of the default branch, so commit and push first.
on:
  workflow_dispatch:

# Least-privilege token: read the repo, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer runs cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: python3 -m pip install --upgrade mkdocs-material

      # site-src/ holds the homepage plus symlinks to the real course folders.
      # The symlinks are not committed, so regenerate them here (this mirrors the
      # `just site-links` recipe exactly).
      - name: Regenerate site-src symlinks
        run: |
          mkdir -p site-src
          for d in syllabus tasks challenges projects tutorials benchmarks assessment resources; do
            ln -sfn "../$d" "site-src/$d"
          done
          for f in PROGRESSION.md DECISIONS.md CLAUDE.md; do
            ln -sfn "../$f" "site-src/$f"
          done

      # Build (and test) the course site into site/. --strict fails on broken
      # links and nav warnings.
      - name: Build the course site (strict)
        run: mkdocs build --strict

      # The concept map's data is derived from notes/PROGRESSION.md and the
      # sidecars, so it is generated here rather than committed. No third-party
      # dependencies: the generator is plain python3 on purpose.
      - name: Generate the notes concept-map data
        run: python3 scripts/notes_site_data.py

      # Assemble the deployment: the notes own the root, the course lives under
      # /course/. The book PDF is committed in notes/site/ and comes along with
      # the first copy.
      - name: Assemble _site (notes at root, course under /course/)
        run: |
          mkdir -p _site/course
          cp -R notes/site/. _site/
          cp -R site/.       _site/course/

      # mkdocs --strict only gates the course subtree; guard the assembly too,
      # so a broken root cannot ship just because the course built cleanly.
      - name: Smoke-check the assembled site
        run: |
          test -f _site/index.html
          test -f _site/map.html
          test -f _site/data/graph.json
          test -f _site/course/index.html
          test -f _site/agentic-development-notes.pdf || \
            echo "::warning::notes PDF missing — run 'just notes-pdf' and commit it"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
